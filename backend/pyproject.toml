[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "galanjabal3",email = "galanjabal3@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "falcon",
    "uvicorn",
    "psutil",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# Aplikasi, bukan library: hanya dependensi yang dipasang (bukan root package).
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^7"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]